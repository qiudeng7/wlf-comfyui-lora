name: One-time verified LoRA transfer
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-lora-release
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'qiudeng7/wlf-comfyui-lora' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_HOST: github.com
      GH_PROMPT_DISABLED: '1'
      EXPECTED_ASSETS: '[{"id":659420999,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.001","size":52428800,"digest":"sha256:4120699fa6b9d8268462b508a3ab1332220ea2a8c4b1542b16fa88bed1fd919d","state":"uploaded"},{"id":659421952,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.002","size":52428800,"digest":"sha256:97d567e7464a10ad14f97836b505c6e0862072952e6ac3992c61fcea2ed25d5e","state":"uploaded"},{"id":659422938,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.003","size":52428800,"digest":"sha256:d0ee41bfd65cef277d392503e06c4778b32d07f92d5d370570ce7c984999c7e9","state":"uploaded"},{"id":659424158,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.004","size":52428800,"digest":"sha256:f340831275a512fd9af91e141276d5323d88ef60a42ca6480d20a560c70b042e","state":"uploaded"},{"id":659425135,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.005","size":52428800,"digest":"sha256:2bf39b35ac2b418cfb79bbb6eebf735c3c3e7ff2f1d9b9341d6b8727f083c9d4","state":"uploaded"},{"id":659426092,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.006","size":52428800,"digest":"sha256:39313d4ce8703f0b5e16338a9214b0390ca09e2daee273edc2078148ab57f35e","state":"uploaded"},{"id":659427082,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.007","size":52428800,"digest":"sha256:fb83828980f2cdb9229ee36cf440bf1d0de1a69267197492b611944261e2ee3e","state":"uploaded"},{"id":659428010,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.008","size":52428800,"digest":"sha256:993e3fdd985b5ca894691025252e58a6347aa08ffd2c8284b583b4d730e6e296","state":"uploaded"},{"id":659429433,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.009","size":52428800,"digest":"sha256:85581b1f7d35e49547c3ef79ec8bf506cef6079501c343113372deaf4e52f966","state":"uploaded"},{"id":659430496,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.010","size":52428800,"digest":"sha256:605500a9d335bdd8a934d2dd36afaeeae0d2f80a6a8218dfd27e5d4777a6283c","state":"uploaded"},{"id":659431365,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.011","size":52428800,"digest":"sha256:82c178bfa5e14b274bda99e33e792d839442a5baa34dd7e5195e14cd9e6d51ed","state":"uploaded"},{"id":659432363,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.012","size":52428800,"digest":"sha256:2ec0f4a442f89ebfc6ae66a63878d638ef7fbb9657cfcb1432574c3e2ddc64d3","state":"uploaded"},{"id":659433423,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.013","size":52428800,"digest":"sha256:1818a72be31d836bdb72038312b69cb36f2ca2563e5e673f5f21b6b8091d7d95","state":"uploaded"},{"id":659434416,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.014","size":52428800,"digest":"sha256:5271e6eacc41d5436702065b303d8f82447c3ca2d92269542b5b8504accd1146","state":"uploaded"},{"id":659417054,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.015","size":52428800,"digest":"sha256:a82be6c47701b9fe96e927984e41ee2dcd220d9b65c3eeba452a684fadbd1587","state":"uploaded"},{"id":659417966,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.016","size":52428800,"digest":"sha256:f60bf4f882c9a06f3efd9e6dc2180bb0e37e2c3e8e7df7530b0195ef18588412","state":"uploaded"},{"id":659418877,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.017","size":52428800,"digest":"sha256:737e5e85cfd4ba824c1b1299ba374f14926c863d6bedd1664a86cf0e7c676f6b","state":"uploaded"},{"id":659419818,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.018","size":52428800,"digest":"sha256:a52b1e1de792d95015fa364096b7d0e93d1ddba4a0129d5476d451585df7069e","state":"uploaded"},{"id":659420613,"name":"minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.019","size":23673445,"digest":"sha256:f6f1f43f0f9e661c0a6a3418f15ca37095ee94f9292da8453700d676f74dff29","state":"uploaded"}]'
    steps:
      - name: Download only allowlisted source assets and verify SHA-256
        env:
          GH_TOKEN: ${{ secrets.SOURCE_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          expected = json.loads(os.environ['EXPECTED_ASSETS'])
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'wlf-lora-transfer'
          root.mkdir(exist_ok=False)
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          source = api('repos/qiudeng7/wlf-comfyui/releases/tags/lora')
          assert source['id'] == 418437516 and source['tag_name'] == 'lora'
          actual = sorted([{k: a[k] for k in ('id', 'name', 'size', 'digest', 'state')} for a in source['assets']], key=lambda a: a['name'])
          assert actual == expected, 'Source asset snapshot changed'
          assert len(expected) == 19
          for index, asset in enumerate(expected, 1):
              assert asset['name'] == f'minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.7z.{index:03}'
              assert asset['size'] == (52428800 if index < 19 else 23673445)
              path = root / asset['name']
              with path.open('xb') as output:
                  subprocess.run(['gh', 'api', f"repos/qiudeng7/wlf-comfyui/releases/assets/{asset['id']}", '-H', 'Accept: application/octet-stream'], stdout=output, check=True)
              assert path.stat().st_size == asset['size'], 'Downloaded size mismatch'
              with path.open('rb') as content:
                  digest = 'sha256:' + hashlib.file_digest(content, 'sha256').hexdigest()
              assert digest == asset['digest'], 'Downloaded digest mismatch'
              print(f"Verified download {index}/19: {asset['name']} {digest}")
          PY
      - name: Upload to draft, verify destination, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          expected = json.loads(os.environ['EXPECTED_ASSETS'])
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'wlf-lora-transfer'
          repo = 'qiudeng7/wlf-comfyui-lora'
          body = '''Verified byte-for-byte mirror: 19 split volumes, 967391845 bytes.

          Publisher: https://huggingface.co/lightx2v/Minimax-h3-Turbo/tree/30f485ed874aa44c8183348ad361c5eabad318da
          Upstream license copies and NOTICE (no relicensing):
          https://github.com/qiudeng7/wlf-comfyui-lora/blob/main/licenses/MINIMAX-H3-LICENSE.txt
          https://github.com/qiudeng7/wlf-comfyui-lora/blob/main/licenses/PUBLISHER-APACHE-2.0.txt
          https://github.com/qiudeng7/wlf-comfyui-lora/blob/main/NOTICE.txt
          SHA-256 manifest: https://github.com/qiudeng7/wlf-comfyui-lora/blob/main/assets.json

          Applicable upstream territorial and use restrictions remain in force. This mirror does not relicense the weights or waive upstream restrictions.
          Transfer marker: wlf-lora-418437516-v1'''
          def api(path, method='GET', payload=None):
              args = ['gh', 'api', path, '--method', method]
              if payload is not None:
                  args += ['--input', '-']
              return json.loads(subprocess.check_output(args, input=json.dumps(payload).encode() if payload is not None else None))
          releases = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases', '--paginate', '--slurp']))
          matches = [r for page in releases for r in page if r['tag_name'] == 'lora']
          assert len(matches) <= 1
          if matches:
              release = matches[0]
              assert release['draft'] and release['body'] == body, 'Existing release is not our resumable draft'
          else:
              release = api(f'repos/{repo}/releases', 'POST', {'tag_name': 'lora', 'target_commitish': os.environ['GITHUB_SHA'], 'name': 'MiniMax-H3 Ref2VA Turbo 4-step v0.1 ComfyUI BF16', 'body': body, 'draft': True})
          endpoint = f"repos/{repo}/releases/{release['id']}"
          def check_assets(assets, complete):
              by_name = {a['name']: a for a in assets}
              allowed = {a['name']: a for a in expected}
              assert len(by_name) == len(assets) and set(by_name) <= set(allowed), 'Unexpected destination asset'
              if complete:
                  assert set(by_name) == set(allowed), 'Incomplete destination asset set'
              for name, asset in by_name.items():
                  assert asset['state'] == 'uploaded'
                  assert asset['size'] == allowed[name]['size'] and asset['digest'] == allowed[name]['digest'], 'Destination mismatch; refusing overwrite'
              return by_name
          existing = check_assets(api(endpoint)['assets'], False)
          for asset in expected:
              if asset['name'] in existing:
                  continue
              path = root / asset['name']
              assert path.stat().st_size == asset['size']
              with path.open('rb') as content:
                  assert 'sha256:' + hashlib.file_digest(content, 'sha256').hexdigest() == asset['digest']
              subprocess.run(['gh', 'release', 'upload', 'lora', str(path), '--repo', repo], check=True)
          check_assets(api(endpoint)['assets'], True)
          published = api(endpoint, 'PATCH', {'draft': False})
          assert not published['draft']
          check_assets(api(endpoint)['assets'], True)
          print('Published after all 19 size and SHA-256 checks:', published['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Verified 19/19 names, sizes and SHA-256 digests. Total: 967391845 bytes.\n' + published['html_url'] + '\n')
          PY
      - name: Remove only this run's temporary volumes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil
          parent = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          root = parent / 'wlf-lora-transfer'
          assert root.resolve() == root and root.parent == parent and root.name == 'wlf-lora-transfer'
          if root.exists():
              shutil.rmtree(root)
          assert not root.exists()
          print('Verified runner transfer directory removed')
          PY
